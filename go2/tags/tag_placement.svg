<line x1="40" y1="545" x2="500" y2="545" stroke="#999" stroke-width="2"/>
<text x="530" y="62" fill="#222" font-weight="bold">Robot tag: page 1 of the tag sheets</text>
<text x="530" y="84" fill="#222">(tag36h11 ID 0, black square 120 mm)</text>
<text x="530" y="106" fill="#222"></text>
<text x="530" y="128" fill="#222">• Glue it to stiff card first</text>
<text x="530" y="150" fill="#222">• Tape it flat on the back between the</text>
<text x="544" y="172" fill="#222">handle and the head, all four edges down</text>
<text x="530" y="194" fill="#222">• Don't cover the handle</text>
<text x="530" y="216" fill="#222">• Centre it left to right</text>
<text x="530" y="238" fill="#222">• Arrow points to the head</text>
<text x="530" y="260" fill="#222">• Keep it low and flat, so it doesn't block</text>
<text x="544" y="282" fill="#222">the lidar's view</text>
<text x="530" y="304" fill="#222">• Keep the white border showing all round</text>
<text x="530" y="326" fill="#222"></text>
<text x="530" y="348" fill="#222">The phone films it from above and to the side,</text>
<text x="530" y="370" fill="#222">so nothing should cover or shade it.</text>
<text x="530" y="392" fill="#222"></text>
<text x="530" y="414" fill="#222">Not to scale.</text>
